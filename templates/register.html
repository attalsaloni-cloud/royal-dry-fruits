{% extends 'base.html' %}



{% block content %}




<div class="row justify-content-center mt-5">



<div class="col-md-6">



<div class="card shadow p-4">



<h2 class="text-center mb-4">

Create Account ❤️

</h2>




<form method="POST">


{% csrf_token %}



{{form.as_p}}




<button class="btn btn-primary w-100">

Register

</button>



</form>




<p class="text-center mt-3">


Already have an account?


<a href="{% url 'login' %}">

Login

</a>



</p>




</div>


</div>


</div>





{% endblock %}
