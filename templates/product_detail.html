{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        {% if product.image %}
        <img src="{{ product.image.url }}"
             class="card-img-top"
             height="300">
        {% else %}
        <img src="/static/images/no-image.png"
             class="card-img-top"
             height="300">
        {% endif %}


        <div class="card-body">

            <h2>
                {{product.name}}
            </h2>


            <h4>
                ₹{{product.price}}
            </h4>


            <p>
                {{product.description}}
            </p>


            <a href="{% url 'add_cart' product.id %}"
               class="btn btn-success">
                Add To Cart
            </a>


           <a href="{% url 'add_wishlist' product.id %}"
            class="btn btn-danger">

          ❤️ Add To Wishlist

             </a>

        </div>

    </div>

</div>


{% endblock %}
