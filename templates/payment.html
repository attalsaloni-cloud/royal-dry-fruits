{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

<h2>Choose Payment Method</h2>

<h4>Total Amount: ₹{{ order.total }}</h4>

<form method="POST">

    {% csrf_token %}

    <div class="form-check">
        <input class="form-check-input"
               type="radio"
               name="payment_method"
               value="COD"
               checked>

        <label class="form-check-label">
            Cash on Delivery
        </label>
    </div>

    <div class="form-check">
        <input class="form-check-input"
               type="radio"
               name="payment_method"
               value="UPI">

        <label class="form-check-label">
            UPI
        </label>
    </div>

    <div class="form-check">
        <input class="form-check-input"
               type="radio"
               name="payment_method"
               value="Card">

        <label class="form-check-label">
            Debit / Credit Card
        </label>
    </div>

    <div class="form-check">
        <input class="form-check-input"
               type="radio"
               name="payment_method"
               value="Net Banking">

        <label class="form-check-label">
            Net Banking
        </label>
    </div>

    <br>

    <button class="btn btn-success">
        Confirm Payment
    </button>

</form>

</div>

{% endblock %}
